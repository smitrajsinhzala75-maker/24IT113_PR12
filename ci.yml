name: CI Pipeline

# Trigger workflow on push or pull request to the main branch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js runtime environment (version 18)
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # Step 3: Clean install all production and test dependencies
      - name: Install Dependencies
        run: npm install

      # Step 4: Run automated tests with Jest and Supertest
      - name: Run Automated Tests
        run: npm test
